<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendiendo JavaScript</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <!-- Unidad 1 & 2: Ejemplo Inicial y Modificación del DOM -->
    <h1>Mi primera página con JavaScript</h1>
    <p id="mensaje">Bienvenidos al curso</p>
    <button id="btnCambiar">Cambiar mensaje</button>

    <hr>

    <!-- Unidad 3.3: Catálogo Dinámico -->
    <h2>Nuestros productos</h2>
    <div id="catalogo"></div>

    <hr>

    <!-- Unidad 3.4: Buscador -->
    <h2>Buscador de Productos</h2>
    <input type="text" id="buscar" placeholder="Buscar producto">
    <div id="resultados"></div>

    <hr>

    <!-- Unidad 3.5: Formulario de Validación -->
    <h2>Formulario de Contacto</h2>
    <form id="formulario">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" required>

        <label for="correo">Correo:</label>
        <input type="email" id="correo" required>

        <button type="submit">Enviar</button>
    </form>
    <p id="respuesta"></p>

    <hr>

    <!-- Unidad 4: Ejercicio Integrador (Carrito de Compras) -->
    <h1>Mi tienda de práctica</h1>
    <div id="productos"></div>

    <h2>Mi carrito</h2>
    <div id="carrito"></div>
    <h3 id="total">Total: $0</h3>

    <!-- Conexión del script de JavaScript -->
    <script src="js/app.js"></script>
</body>
</html>
